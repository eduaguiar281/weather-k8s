apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://172.23.0.51:3100/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods
        static_configs:
          - targets:
              - localhost
            labels:
              __path__: /var/log/pods/*/*/*.log

        pipeline_stages:
          - cri: {}

          # Extrai namespace, pod e container do caminho do arquivo
          - regex:
              expression: '/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>[^_]+)_[^/]+/(?P<container>[^/]+)/.*'
              source: filename

          - labels:
              namespace:
              pod:
              container:

          # Define job a partir do namespace/pod
          - template:
              source: job
              template: '{{ .namespace }}/{{ .pod }}'

          - labels:
              job:

          # Deriva env a partir do namespace (uma linha — evita newline no valor do label)
          - template:
              source: env
              template: '{{ if eq .namespace "weather-dev" }}dev{{ else if eq .namespace "weather" }}prod{{ else }}{{ end }}'

          - labels:
              env:

          # Alinha labels com resource OTel (Loki/Queries) — mesmo valor em dev e prod
          - match:
              selector: '{namespace=~"weather.*"}'
              stages:
                - template:
                    source: app_name
                    template: weather.api
                - labels:
                    app_name:
                - template:
                    source: service_name
                    template: weather.api
                - labels:
                    service_name:
                - template:
                    source: deployment_environment
                    template: '{{ if eq .namespace "weather-dev" }}dev{{ else if eq .namespace "weather" }}prod{{ else }}{{ end }}'
                - labels:
                    deployment_environment:
