apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://172.23.0.51:3100/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod

        pipeline_stages:
          - cri: {}

        relabel_configs:
          # Só processa pods rodando neste nó
          - source_labels: [__meta_kubernetes_pod_node_name]
            action: keep
            regex: ${NODE_NAME}

          # Descarta pods sem nome de container (pods terminando)
          - source_labels: [__meta_kubernetes_pod_container_name]
            action: drop
            regex: ''

          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container

          - source_labels: [__meta_kubernetes_pod_label_app_name]
            target_label: app_name

          - source_labels: [__meta_kubernetes_pod_label_env]
            target_label: env

          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_label_app]
            separator: /
            target_label: job

          # Monta o caminho do arquivo de log no host
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            separator: /
            regex: (.+)/(.+)
            target_label: __path__
            replacement: /var/log/pods/*$1*/$2/*.log
