apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://172.23.0.51:3100/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods
        pipeline_stages:
          - cri: {}
          - multiline:
              firstline: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}|^(INFO|WARNING|ERROR|DEBUG|CRITICAL):'
              max_wait_time: 1s
          - regex:
              expression: '/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>[^_]+)_[^/]+/(?P<container>[^/]+)/.*'
              source: filename
          - labels:
              namespace:
              pod:
              container:
          - template:
              source: namespace
              template: '{{ if eq .Value "weather" }}weather/weather-api{{ else }}{{ .Value }}{{ end }}'
              target: job
          - labels:
              job:
          - regex:
              expression: '(?P<otel_sdk_log>otel-auto-instrumentation-python|opentelemetry\.(sdk|exporter|instrumentation))'
          - template:
              source: log_source
              template: '{{ if .otel_sdk_log }}otel_sdk{{ else }}app{{ end }}'
          - labels:
              log_source:
        static_configs:
          - targets:
              - localhost
            labels:
              __path__: /var/log/pods/*/*/*.log
