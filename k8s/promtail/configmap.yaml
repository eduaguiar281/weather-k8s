apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://172.23.0.51:3100/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods
        pipeline_stages:
          - cri: {}
          - regex:
              expression: '/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>[^_]+)_[^/]+/(?P<container>[^/]+)/.*'
              source: filename
          - labels:
              namespace:
              pod:
              container:
          - template:
              source: namespace
              template: '{{ if eq .Value "weather" }}weather/weather-api{{ else }}{{ .Value }}{{ end }}'
              target: job
          - labels:
              job:
        static_configs:
          - targets:
              - localhost
            labels:
              __path__: /var/log/pods/*/*/*.log
