apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: filemanager-instrumentation
  namespace: file-manager
spec:
  exporter:
    endpoint: http://172.23.0.50:4318
  propagators:
    - tracecontext
    - baggage
  python:
    env:
      - name: OTEL_LOGS_EXPORTER
        value: otlp
      - name: OTEL_PYTHON_LOG_CORRELATION
        value: "true"
      - name: OTEL_SERVICE_NAME
        value: pm.file-manager
      - name: OTEL_RESOURCE_ATTRIBUTES
        value: "service.name=pm.file-manager,application.name=pm.file-manager"
