apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: weather-api-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:eduaguiar281/weather-k8s.git
    path: k8s/overlays/dev
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: weather-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
