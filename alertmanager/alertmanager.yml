global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'alert-agent'

  # Exemplo de rota específica para alertas críticos
  # routes:
  #   - match:
  #       severity: critical
  #     receiver: 'slack-critical'

receivers:
  # Alert Agent (FastAPI) — URL deve ser alcançável a partir do container do Alertmanager.
  # Padrão: host do Docker → port-forward do agente no Kind na porta 9093 (./scripts/deploy-agent.sh).
  - name: 'alert-agent'
    webhook_configs:
      - url: 'http://host.docker.internal:9093/webhook'
        send_resolved: true

# Suprime alertas de warning quando o mesmo alerta já disparou como critical
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'job', 'instance']
