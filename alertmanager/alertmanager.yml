global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'default'

  # Exemplo de rota específica para alertas críticos
  # routes:
  #   - match:
  #       severity: critical
  #     receiver: 'slack-critical'

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'https://webhook-test.net/webhook/3c6212dcae74c3e0f99ff663c809ee89'
        send_resolved: true

# Suprime alertas de warning quando o mesmo alerta já disparou como critical
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'job', 'instance']
