apiVersion: 1

datasources:

  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: '15s'
      manageAlerts: true
      alertmanagerUid: alertmanager
    # Permite ao Grafana listar/visualizar (read-only) as regras do Prometheus
    # na UI de Alerting → Alert rules (datasource-managed).

  - name: Alertmanager
    type: alertmanager
    uid: alertmanager
    access: proxy
    url: http://alertmanager:9093
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false

  - name: Loki
    type: loki
    uid: P8E80F9AEF21F6940
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      # Derived fields: extrai trace_id do corpo do log e cria link para Jaeger
      derivedFields:
        - name: TraceID
          datasourceUid: PC9A941E8F2E49454
          matcherRegex: 'trace_id=([a-f0-9]{32})'
          url: '$${__value.raw}'
          urlDisplayLabel: 'Abrir no Jaeger'

  - name: Jaeger
    type: jaeger
    uid: PC9A941E8F2E49454
    access: proxy
    url: http://jaeger:16686
    jsonData:
      # Trace → Logs: ao visualizar um trace no Jaeger, busca logs relacionados no Loki
      tracesToLogsV2:
        datasourceUid: P8E80F9AEF21F6940
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{namespace="weather", container="weather-api", log_source="app"} |= "trace_id=$${__trace.traceId}"'
