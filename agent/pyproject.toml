[project]
name = "alert-agent"
version = "0.1.0"
description = "Agente de análise de alertas do Grafana com LLM via LangChain"
requires-python = ">=3.12"
dependencies = [
    "azure-storage-blob>=12.19",
    "fastapi>=0.115",
    "aio-pika>=9.4",
    "python-json-logger==2.0.7",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "black>=24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["alert_agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
# Evita suíte a parecer “travada” se algum teste bloquear (I/O, asyncio).
timeout = 120

[tool.coverage.run]
source = ["alert_agent"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
