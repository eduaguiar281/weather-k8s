server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # Logs do sistema (host)
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          host: local
          __path__: /var/log/*log

  # Logs de todos os containers Docker
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            stream: stream
            attrs: attrs
            tag: attrs.tag
      - labels:
          stream:
          tag:
      - timestamp:
          source: time
          format: RFC3339Nano
