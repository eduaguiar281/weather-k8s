global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "rules/*.yml"

scrape_configs:

  # Prometheus se auto-monitora
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Métricas exportadas pelo OTel Collector
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  # Métricas do host via Node Exporter
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

# BEGIN infra-kind-metrics
  # Métricas de objetos Kubernetes (deployments, pods, restarts, etc.)
  - job_name: 'kube-state-metrics-kind'
    metrics_path: /metrics
    static_configs:
      - targets: ['local-control-plane:30081']

  # Métricas de uso real de CPU/memória por container/pod
  - job_name: 'cadvisor-kind'
    metrics_path: /metrics
    static_configs:
      - targets: ['local-control-plane:30080']
    metric_relabel_configs:
      - source_labels: [container_label_io_kubernetes_pod_name]
        target_label: pod
      - source_labels: [container_label_io_kubernetes_pod_namespace]
        target_label: namespace
      - source_labels: [container_label_io_kubernetes_container_name]
        target_label: container
# END infra-kind-metrics
